name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          pip install -r requirements.txt
          flake8 .
          pytest --cov=app --cov-fail-under=80

      - run: |
          test "$(python app.py)" = "5"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - run: echo "Deploying application..."
