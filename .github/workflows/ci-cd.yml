name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # DEBUG STEP (IMPORTANT - shows what GitHub actually sees)
      - name: Debug file structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "All files:"
          ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            echo "requirements.txt found, installing..."
            pip install -r requirements.txt
          else
            echo "requirements.txt NOT FOUND"
            exit 1
          fi

      - name: Install test tools (fallback safety)
        run: |
          pip install pytest pytest-cov flake8

      - name: Lint code
        run: |
          flake8 . || true

      - name: Run tests
        run: |
          pytest test_app.py --cov=. --cov-report=term --cov-fail-under=80

      - name: Validate app output
        run: |
          output=$(python app.py)
          echo "Output: $output"

          if [ "$output" != "5" ]; then
            echo "ERROR: Expected 5 but got $output"
            exit 1
          fi

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy
        run: echo "Deploying application..."

      - name: Post deploy check
        run: echo "Deployment successful"
